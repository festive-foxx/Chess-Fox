<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Chess</title>
    <!-- Stylesheet for Chessboard graphics -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a24;
            color: #e0e0e0;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            color: #ff6b35;
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 2.2rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        button {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff6b35;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #e05320;
            transform: translateY(-1px);
        }

        button.secondary {
            background-color: #2a2a36;
            border: 1px solid #ff6b35;
        }

        button.secondary:hover {
            background-color: #3b3b4d;
        }

        button.spectate-btn {
            background-color: #4a5568;
            padding: 6px 12px;
            font-size: 12px;
        }

        button.spectate-btn:hover {
            background-color: #2d3748;
        }

        input {
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2a2a36;
            color: #ffffff;
            outline: none;
        }

        /* Ongoing Games Lobby Styling */
        #lobbyCard {
            width: 620px;
            background-color: #2a2a36;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        #lobbyCard h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #ffaa5b;
            font-size: 16px;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }

        .game-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: #1a1a24;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .game-item-actions {
            display: flex;
            gap: 8px;
        }

        #status {
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 15px;
            font-size: 16px;
            color: #ffaa5b;
            height: 24px;
        }

        .timer-box {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 15px;
        }

        .timer {
            font-size: 20px;
            font-weight: bold;
            padding: 12px 15px;
            border-radius: 8px;
            background: #2a2a36;
            color: #ffffff;
            border: 2px solid #444;
            width: 140px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .timer.active {
            border-color: #ff6b35;
            box-shadow: 0 0 12px rgba(255, 107, 53, 0.5);
        }

        .game-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        #board {
            width: 400px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        .history-box {
            width: 200px;
            height: 400px;
            background: #2a2a36;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .history-box h3 {
            margin-top: 0;
            font-size: 16px;
            color: #ff6b35;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }

        #moveList {
            overflow-y: auto;
            flex-grow: 1;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #cccccc;
        }

        #moveList strong {
            color: #ffaa5b;
        }
    </style>
</head>
<body>

    <h1>Fox Chess</h1>

    <div class="controls">
        <button onclick="startAIGame()">Play vs AI</button>
        <button class="secondary" onclick="startLocalGame()">Pass-and-Play (Local)</button>
        <button class="secondary" onclick="createRoom()">Create Remote Room</button>
    </div>

    <div class="controls">
        <input type="text" id="roomInput" placeholder="Enter 6-char Code">
        <button class="secondary" onclick="joinRoom()">Join Room</button>
    </div>

    <!-- Active Matches Lobby -->
    <div id="lobbyCard">
        <h3>Ongoing & Waiting Matches</h3>
        <div id="gameList">No active matches online. Create one to begin!</div>
    </div>

    <div class="timer-box">
        <div id="whiteTimer" class="timer">White: 05:00</div>
        <div id="blackTimer" class="timer">Black: 05:00</div>
    </div>

    <div id="status">Select a game mode to start.</div>

    <div class="game-container">
        <div id="board"></div>

        <div class="history-box">
            <h3>Moves Taken</h3>
            <div id="moveList">No moves yet.</div>
        </div>
    </div>

    <!-- JavaScript Dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script>
        const socket = io();
        let board = null;
        let game = new Chess();
        let playerColor = 'white';
        let currentRoom = null;
        let mode = 'ai'; // 'local', 'remote', 'ai', 'spectator'

        const INITIAL_TIME_IN_SECONDS = 300; 
        let whiteTime = INITIAL_TIME_IN_SECONDS;
        let blackTime = INITIAL_TIME_IN_SECONDS;
        let timerInterval = null;

        const PIECE_THEME_URL = 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png';

        /* --- Drag and Drop Restrictions --- */
        function onDragStart(source, piece, position, orientation) {
            if (game.game_over() || mode === 'spectator') return false;

            if (mode === 'remote') {
                if ((playerColor === 'white' && piece.search(/^b/) !== -1) ||
                    (playerColor === 'black' && piece.search(/^w/) !== -1)) {
                    return false;
                }
                if ((game.turn() === 'w' && playerColor !== 'white') ||
                    (game.turn() === 'b' && playerColor !== 'black')) {
                    return false;
                }
            } else if (mode === 'ai') {
                if (piece.search(/^b/) !== -1 || game.turn() !== 'w') return false;
            }
        }

        function onDrop(source, target) {
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateGameState();

            if (mode === 'remote' && currentRoom) {
                socket.emit('make_move', { room_code: currentRoom, move: move, fen: game.fen() });
            } else if (mode === 'ai' && game.turn() === 'b') {
                makeAIMove();
            }
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        /* --- AI Logic --- */
        function makeAIMove() {
            if (game.game_over()) return;
            $('#status').text("Fox AI is thinking...");
            
            setTimeout(() => {
                const possibleMoves = game.moves();
                if (possibleMoves.length === 0) return;
                
                const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                game.move(randomMove);
                board.position(game.fen());
                updateGameState();
            }, 350);
        }

        /* --- Lobby & Spectator Handlers --- */
        socket.on('game_list_updated', (games) => {
            if (games.length === 0) {
                $('#gameList').html('No active matches online. Create one to begin!');
                return;
            }

            let html = '';
            games.forEach(g => {
                const canJoin = g.player_count < 2;
                html += `
                    <div class="game-item">
                        <span><strong>Room ${g.code}</strong> - ${g.status} (${g.spectator_count} spectating)</span>
                        <div class="game-item-actions">
                            ${canJoin ? `<button onclick="quickJoin('${g.code}')">Join as P2</button>` : ''}
                            <button class="spectate-btn" onclick="spectateRoom('${g.code}')">Spectate</button>
                        </div>
                    </div>
                `;
            });
            $('#gameList').html(html);
        });

        function quickJoin(code) {
            $('#roomInput').val(code);
            joinRoom();
        }

        function spectateRoom(code) {
            mode = 'spectator';
            currentRoom = code;
            socket.emit('spectate_room', { room_code: code });
        }

        socket.on('spectate_joined', (data) => {
            currentRoom = data.room_code;
            game.load(data.fen);
            resetTimers();

            board = Chessboard('board', {
                draggable: false, // Spectators cannot move pieces
                position: data.fen,
                pieceTheme: PIECE_THEME_URL
            });

            renderMoveHistory();
            $('#status').text('Spectating Match: ' + currentRoom);
            startTimer();
        });

        /* --- Game State & Timer Updates --- */
        function updateGameState() {
            updateStatusText();
            renderMoveHistory();
            startTimer();
        }

        function updateStatusText() {
            let moveColor = game.turn() === 'w' ? 'White' : 'Black';
            let statusText = '';

            if (game.in_checkmate()) {
                statusText = 'Game over! ' + moveColor + ' is in checkmate.';
                stopTimer();
            } else if (game.in_draw()) {
                statusText = 'Game over! Stalemate / Draw.';
                stopTimer();
            } else {
                statusText = (mode === 'spectator' ? 'Spectating: ' : '') + moveColor + ' to move.';
                if (game.in_check()) statusText += ' (' + moveColor + ' is in check)';
            }
            $('#status').text(statusText);
        }

        function renderMoveHistory() {
            const history = game.history();
            if (history.length === 0) {
                $('#moveList').html('No moves yet.');
                return;
            }

            let historyHTML = '';
            for (let i = 0; i < history.length; i += 2) {
                const moveNumber = Math.floor(i / 2) + 1;
                const whiteMove = history[i];
                const blackMove = history[i + 1] ? history[i + 1] : '';
                historyHTML += `<div><strong>${moveNumber}.</strong> ${whiteMove} ${blackMove}</div>`;
            }

            const moveListDiv = $('#moveList');
            moveListDiv.html(historyHTML);
            moveListDiv.scrollTop(moveListDiv[0].scrollHeight);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateTimerDisplay() {
            $('#whiteTimer').text('White: ' + formatTime(whiteTime));
            $('#blackTimer').text('Black: ' + formatTime(blackTime));

            if (game.turn() === 'w') {
                $('#whiteTimer').addClass('active');
                $('#blackTimer').removeClass('active');
            } else {
                $('#blackTimer').addClass('active');
                $('#whiteTimer').removeClass('active');
            }
        }

        function startTimer() {
            stopTimer();
            if (game.game_over()) return;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                if (game.turn() === 'w') {
                    whiteTime--;
                    if (whiteTime <= 0) {
                        whiteTime = 0;
                        stopTimer();
                        $('#status').text('Game Over! Black wins on time.');
                    }
                } else {
                    blackTime--;
                    if (blackTime <= 0) {
                        blackTime = 0;
                        stopTimer();
                        $('#status').text('Game Over! White wins on time.');
                    }
                }
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimers() {
            stopTimer();
            whiteTime = INITIAL_TIME_IN_SECONDS;
            blackTime = INITIAL_TIME_IN_SECONDS;
            updateTimerDisplay();
        }

        /* --- Mode Controls --- */
        function startAIGame() {
            mode = 'ai';
            currentRoom = null;
            game.reset();
            resetTimers();
            renderMoveHistory();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            $('#status').text('Playing vs Fox AI. You are White!');
            startTimer();
        }

        function startLocalGame() {
            mode = 'local';
            currentRoom = null;
            game.reset();
            resetTimers();
            renderMoveHistory();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            $('#status').text('Local game started. White to move.');
            startTimer();
        }

        function createRoom() {
            mode = 'remote';
            socket.emit('create_room');
        }

        function joinRoom() {
            const roomCode = $('#roomInput').val().trim();
            if (roomCode.length === 0) return alert('Please enter a room code.');
            mode = 'remote';
            socket.emit('join_room', { room_code: roomCode });
        }

        /* --- Socket Listeners --- */
        socket.on('room_created', (data) => {
            currentRoom = data.room_code;
            playerColor = data.color;
            game.reset();
            resetTimers();
            renderMoveHistory();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                orientation: 'white',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            $('#status').text('Room created! Code: ' + currentRoom + '. Waiting for Player 2...');
        });

        socket.on('player_joined', (data) => {
            currentRoom = data.room_code;
            playerColor = data.color;
            game.reset();
            resetTimers();
            renderMoveHistory();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                orientation: 'black',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            $('#status').text('Joined room ' + currentRoom + ' as Black.');
        });

        socket.on('game_start', (data) => {
            $('#status').text(data.message);
            startTimer();
        });

        socket.on('move_made', (data) => {
            if (data.fen) {
                game.load(data.fen);
            } else if (data.move) {
                game.move(data.move);
            }
            board.position(game.fen());
            updateGameState();
        });

        socket.on('error_message', (data) => {
            alert(data.message);
        });

        startAIGame();
    </script>
</body>
</html>
