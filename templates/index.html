<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Chess</title>
    <!-- Stylesheet for the Chessboard graphics -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            padding: 20px;
        }
        
        .game-container {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            align-items: flex-start;
        }

        #board {
            width: 400px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button, input {
            padding: 8px 12px;
            font-size: 14px;
        }

        #status {
            font-weight: bold;
            margin-top: 10px;
            font-size: 16px;
        }

        /* Timers UI Styling */
        .timer-box {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 10px;
        }

        .timer {
            font-size: 20px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 6px;
            background: #ffffff;
            border: 2px solid #ccc;
            width: 140px;
            text-align: center;
        }

        .timer.active {
            border-color: #4CAF50;
            background-color: #e8f5e9;
        }

        /* Move History Box Styling */
        .history-box {
            width: 200px;
            height: 400px;
            background: #ffffff;
            border: 2px solid #ccc;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .history-box h3 {
            margin-top: 0;
            font-size: 16px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        #moveList {
            overflow-y: auto;
            flex-grow: 1;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>Fox Chess</h1>

    <div class="controls">
        <button onclick="startLocalGame()">Play Pass-and-Play (Local)</button>
        <button onclick="createRoom()">Create Remote Room</button>
    </div>

    <div class="controls">
        <input type="text" id="roomInput" placeholder="Enter 6-char Code">
        <button onclick="joinRoom()">Join Room</button>
    </div>

    <!-- Clock Displays for White and Black -->
    <div class="timer-box">
        <div id="whiteTimer" class="timer">White: 05:00</div>
        <div id="blackTimer" class="timer">Black: 05:00</div>
    </div>

    <div id="status">Select a game mode to start.</div>

    <!-- Main Game Area: Chessboard + Move History Side-by-Side -->
    <div class="game-container">
        <div id="board"></div>

        <div class="history-box">
            <h3>Moves Taken</h3>
            <div id="moveList">No moves yet.</div>
        </div>
    </div>

    <!-- External JavaScript Libraries for Chess Logic & WebSockets -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script>
        const socket = io();
        let board = null;
        let game = new Chess();
        let playerColor = 'white';
        let currentRoom = null;
        let mode = 'local';

        // Timer Configuration (Adjustable: 300 seconds = 5 minutes)
        const INITIAL_TIME_IN_SECONDS = 300; 
        let whiteTime = INITIAL_TIME_IN_SECONDS;
        let blackTime = INITIAL_TIME_IN_SECONDS;
        let timerInterval = null;

        // URL template to retrieve piece graphics over CDN online
        const PIECE_THEME_URL = 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png';

        // Prevents picking up illegal pieces or moving out of turn
        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;

            if (mode === 'remote') {
                if ((playerColor === 'white' && piece.search(/^b/) !== -1) ||
                    (playerColor === 'black' && piece.search(/^w/) !== -1)) {
                    return false;
                }
                if ((game.turn() === 'w' && playerColor !== 'white') ||
                    (game.turn() === 'b' && playerColor !== 'black')) {
                    return false;
                }
            }
        }

        // Handles dragging and dropping a piece on a square
        function onDrop(source, target) {
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Auto-promote pawns to Queen
            });

            // Snap piece back if move is illegal
            if (move === null) return 'snapback';

            updateGameState();

            // Send move to Python server if in remote mode
            if (mode === 'remote' && currentRoom) {
                socket.emit('make_move', { room_code: currentRoom, move: move });
            }
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        // Updates game status, renders move history, and shifts timer focus
        function updateGameState() {
            updateStatusText();
            renderMoveHistory();
            startTimer();
        }

        function updateStatusText() {
            let statusText = '';
            let moveColor = game.turn() === 'w' ? 'White' : 'Black';

            if (game.in_checkmate()) {
                statusText = 'Game over! ' + moveColor + ' is in checkmate.';
                stopTimer();
            } else if (game.in_draw()) {
                statusText = 'Game over! Stalemate / Draw.';
                stopTimer();
            } else {
                statusText = moveColor + ' to move.';
                if (game.in_check()) {
                    statusText += ' (' + moveColor + ' is in check)';
                }
            }
            $('#status').text(statusText);
        }

        /* --- Move History Helper Functions --- */
        function renderMoveHistory() {
            const history = game.history();
            if (history.length === 0) {
                $('#moveList').html('No moves yet.');
                return;
            }

            let historyHTML = '';
            for (let i = 0; i < history.length; i += 2) {
                const moveNumber = Math.floor(i / 2) + 1;
                const whiteMove = history[i];
                const blackMove = history[i + 1] ? history[i + 1] : '';
                historyHTML += `<div><strong>${moveNumber}.</strong> ${whiteMove} ${blackMove}</div>`;
            }

            const moveListDiv = $('#moveList');
            moveListDiv.html(historyHTML);
            // Automatically scroll to bottom of move list
            moveListDiv.scrollTop(moveListDiv[0].scrollHeight);
        }

        /* --- Timer Helper Functions --- */
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateTimerDisplay() {
            $('#whiteTimer').text('White: ' + formatTime(whiteTime));
            $('#blackTimer').text('Black: ' + formatTime(blackTime));

            // Highlight the active turn's timer box
            if (game.turn() === 'w') {
                $('#whiteTimer').addClass('active');
                $('#blackTimer').removeClass('active');
            } else {
                $('#blackTimer').addClass('active');
                $('#whiteTimer').removeClass('active');
            }
        }

        function startTimer() {
            stopTimer(); // Clear any existing running interval

            if (game.game_over()) return;

            updateTimerDisplay();

            timerInterval = setInterval(() => {
                if (game.turn() === 'w') {
                    whiteTime--;
                    if (whiteTime <= 0) {
                        whiteTime = 0;
                        stopTimer();
                        $('#status').text('Game Over! Black wins on time.');
                    }
                } else {
                    blackTime--;
                    if (blackTime <= 0) {
                        blackTime = 0;
                        stopTimer();
                        $('#status').text('Game Over! White wins on time.');
                    }
                }
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimers() {
            stopTimer();
            whiteTime = INITIAL_TIME_IN_SECONDS;
            blackTime = INITIAL_TIME_IN_SECONDS;
            updateTimerDisplay();
        }

        /* --- Game Mode Handlers --- */
        function startLocalGame() {
            mode = 'local';
            currentRoom = null;
            game.reset();
            resetTimers();
            renderMoveHistory();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            $('#status').text('Local game started. White to move.');
            startTimer();
        }

        function createRoom() {
            mode = 'remote';
            socket.emit('create_room');
        }

        function joinRoom() {
            const roomCode = $('#roomInput').val().trim();
            if (roomCode.length === 0) return alert('Please enter a room code.');
            mode = 'remote';
            socket.emit('join_room', { room_code: roomCode });
        }

        /* --- Socket Event Handlers --- */
        socket.on('room_created', (data) => {
            currentRoom = data.room_code;
            playerColor = data.color;
            game.reset();
            resetTimers();
            renderMoveHistory();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                orientation: 'white',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            $('#status').text('Room created! Code: ' + currentRoom + '. Share this code with Player 2.');
        });

        socket.on('player_joined', (data) => {
            currentRoom = data.room_code;
            playerColor = data.color;
            game.reset();
            resetTimers();
            renderMoveHistory();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                orientation: 'black',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            $('#status').text('Joined room ' + currentRoom + ' as Black.');
        });

        socket.on('game_start', (data) => {
            $('#status').text(data.message);
            startTimer();
        });

        socket.on('move_made', (data) => {
            game.move(data.move);
            board.position(game.fen());
            updateGameState();
        });

        socket.on('error_message', (data) => {
            alert(data.message);
        });

        // Initialize local board on load
        startLocalGame();
    </script>
</body>
</html>
