<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Chess</title>
    <!-- Stylesheet for the Chessboard graphics -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        /* Base page styling (Dark Slate Theme) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a24;
            color: #e0e0e0;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            color: #ff6b35; /* Vibrant Fox Orange */
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 2.2rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        /* Modernized Buttons */
        button {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff6b35;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #e05320;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Secondary Button Style */
        button.secondary {
            background-color: #2a2a36;
            border: 1px solid #ff6b35;
        }

        button.secondary:hover {
            background-color: #3b3b4d;
        }

        /* Styled Input Fields */
        input {
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2a2a36;
            color: #ffffff;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        input::placeholder {
            color: #888899;
        }

        /* Interactive Tutorial Card Styling */
        #tutorialCard {
            display: none;
            width: 620px;
            background-color: #2a2a36;
            border: 2px solid #ff6b35;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.3);
            box-sizing: border-box;
        }

        #tutorialCard h2 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #ffaa5b;
            display: flex;
            justify-content: space-between;
        }

        #tutorialCard p {
            margin: 5px 0;
            font-size: 14px;
            line-height: 1.5;
            color: #dddddd;
        }

        #tutorialHint {
            font-style: italic;
            color: #ff6b35;
            font-weight: bold;
            margin-top: 8px;
        }

        #status {
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 15px;
            font-size: 16px;
            color: #ffaa5b;
            height: 24px;
        }

        /* Timers UI Styling */
        .timer-box {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 15px;
        }

        .timer {
            font-size: 20px;
            font-weight: bold;
            padding: 12px 15px;
            border-radius: 8px;
            background: #2a2a36;
            color: #ffffff;
            border: 2px solid #444;
            width: 140px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .timer.active {
            border-color: #ff6b35;
            box-shadow: 0 0 12px rgba(255, 107, 53, 0.5);
        }

        /* Main Board & Move History Layout */
        .game-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        #board {
            width: 400px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        /* Move History Box Styling */
        .history-box {
            width: 200px;
            height: 400px;
            background: #2a2a36;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .history-box h3 {
            margin-top: 0;
            font-size: 16px;
            color: #ff6b35;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }

        #moveList {
            overflow-y: auto;
            flex-grow: 1;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #cccccc;
        }

        #moveList strong {
            color: #ffaa5b;
        }
    </style>
</head>
<body>

    <h1>Fox Chess</h1>

    <!-- Mode Selection Controls -->
    <div class="controls">
        <button onclick="startTutorialMode()">Interactive Tutorial Mode</button>
        <button class="secondary" onclick="startLocalGame()">Pass-and-Play (Local)</button>
        <button class="secondary" onclick="createRoom()">Create Remote Room</button>
    </div>

    <div class="controls">
        <input type="text" id="roomInput" placeholder="Enter 6-char Code">
        <button class="secondary" onclick="joinRoom()">Join Room</button>
    </div>

    <!-- Tutorial Guided Lesson Banner -->
    <div id="tutorialCard">
        <h2>
            <span id="lessonTitle">Lesson 1: Center Control</span>
            <span id="lessonStep">Step 1 / 5</span>
        </h2>
        <p id="lessonText">Instructions go here...</p>
        <div id="tutorialHint">Goal: Move piece from e2 to e4</div>
    </div>

    <!-- Clock Displays for White and Black -->
    <div class="timer-box">
        <div id="whiteTimer" class="timer">White: 05:00</div>
        <div id="blackTimer" class="timer">Black: 05:00</div>
    </div>

    <div id="status">Select a game mode to start.</div>

    <!-- Main Game Area: Chessboard + Move History Side-by-Side -->
    <div class="game-container">
        <div id="board"></div>

        <div class="history-box">
            <h3>Moves Taken</h3>
            <div id="moveList">No moves yet.</div>
        </div>
    </div>

    <!-- External JavaScript Libraries for Chess Logic & WebSockets -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script>
        const socket = io();
        let board = null;
        let game = new Chess();
        let playerColor = 'white';
        let currentRoom = null;
        let mode = 'local'; // Options: 'local', 'remote', 'tutorial'

        // Timer Configuration (300 seconds = 5 minutes)
        const INITIAL_TIME_IN_SECONDS = 300; 
        let whiteTime = INITIAL_TIME_IN_SECONDS;
        let blackTime = INITIAL_TIME_IN_SECONDS;
        let timerInterval = null;

        // Tutorial Lesson Data Structure
        let tutorialStep = 0;
        const tutorialLessons = [
            {
                title: "Lesson 1: Pawn Center Control",
                text: "Pawns move forward 1 or 2 squares on their first move. Controlling the center squares (d4, e4, d5, e5) gives your pieces room to maneuver.",
                from: "e2",
                to: "e4",
                opponentMove: { from: "e7", to: "e5" },
                hint: "Try dragging your King's Pawn from e2 to e4."
            },
            {
                title: "Lesson 2: Developing Knights",
                text: "Knights move in an 'L' shape and can jump over pieces. Moving knights toward the center early helps control the board.",
                from: "g1",
                to: "f3",
                opponentMove: { from: "b8", to: "c6" },
                hint: "Move your Knight from g1 to f3 to attack Black's e5 pawn."
            },
            {
                title: "Lesson 3: Developing Bishops",
                text: "Bishops control long diagonals. Developing your King's Bishop opens up avenues to attack the enemy King.",
                from: "f1",
                to: "c4",
                opponentMove: { from: "a7", to: "a6" },
                hint: "Move your Bishop from f1 to c4 to target Black's weak f7 pawn."
            },
            {
                title: "Lesson 4: Queen Infiltration",
                text: "Bring your Queen out to join the attack on the weak f7 square.",
                from: "d1",
                to: "h5",
                opponentMove: { from: "d7", to: "d6" },
                hint: "Move your Queen diagonally from d1 to h5."
            },
            {
                title: "Lesson 5: Delivering Checkmate!",
                text: "The weak f7 pawn is defended only by Black's King. Capture it with your Queen to deliver Checkmate!",
                from: "h5",
                to: "f7",
                opponentMove: null, // Checkmate ends the lesson
                hint: "Move your Queen from h5 to f7 to win the game!"
            }
        ];

        // Graphic theme URL for piece images
        const PIECE_THEME_URL = 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png';

        // Prevents picking up illegal pieces or moving out of turn
        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;

            if (mode === 'remote') {
                if ((playerColor === 'white' && piece.search(/^b/) !== -1) ||
                    (playerColor === 'black' && piece.search(/^w/) !== -1)) {
                    return false;
                }
                if ((game.turn() === 'w' && playerColor !== 'white') ||
                    (game.turn() === 'b' && playerColor !== 'black')) {
                    return false;
                }
            } else if (mode === 'tutorial') {
                // In tutorial, player only moves White
                if (piece.search(/^b/) !== -1 || game.turn() !== 'w') {
                    return false;
                }
            }
        }

        // Handles dragging and dropping a piece on a square
        function onDrop(source, target) {
            // Check move correctness if in Tutorial Mode
            if (mode === 'tutorial') {
                const currentLesson = tutorialLessons[tutorialStep];
                if (source !== currentLesson.from || target !== currentLesson.to) {
                    $('#tutorialHint').text("❌ Incorrect move! " + currentLesson.hint);
                    return 'snapback';
                }
            }

            const move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateGameState();

            if (mode === 'remote' && currentRoom) {
                socket.emit('make_move', { room_code: currentRoom, move: move });
            } else if (mode === 'tutorial') {
                handleTutorialProgress();
            }
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        /* --- Tutorial Logic Handlers --- */
        function startTutorialMode() {
            mode = 'tutorial';
            currentRoom = null;
            tutorialStep = 0;
            
            stopTimer(); // Timers stay off during tutorial
            $('#whiteTimer').text('White: --:--').removeClass('active');
            $('#blackTimer').text('Black: --:--').removeClass('active');
            
            $('#tutorialCard').slideDown();
            game.reset();
            renderMoveHistory();

            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });

            loadTutorialLesson(tutorialStep);
        }

        function loadTutorialLesson(step) {
            const lesson = tutorialLessons[step];
            $('#lessonTitle').text(lesson.title);
            $('#lessonStep').text(`Step ${step + 1} / ${tutorialLessons.length}`);
            $('#lessonText').text(lesson.text);
            $('#tutorialHint').text("💡 Target: Move " + lesson.from.toUpperCase() + " to " + lesson.to.toUpperCase());
            $('#status').text("Tutorial Mode: Your turn (White)");
        }

        function handleTutorialProgress() {
            const lesson = tutorialLessons[tutorialStep];
            
            if (lesson.opponentMove) {
                $('#status').text("Opponent is thinking...");
                setTimeout(() => {
                    game.move(lesson.opponentMove);
                    board.position(game.fen());
                    renderMoveHistory();
                    
                    tutorialStep++;
                    if (tutorialStep < tutorialLessons.length) {
                        loadTutorialLesson(tutorialStep);
                    }
                }, 700);
            } else {
                // Final Checkmate Lesson completed
                $('#tutorialCard').css('border-color', '#4CAF50');
                $('#lessonTitle').text("🎉 Tutorial Completed!");
                $('#lessonText').text("Congratulations! You've learned how to develop your pieces and execute a classic checkmate sequence.");
                $('#tutorialHint').text("Ready to play? Select Pass-and-Play or Remote Room above!");
                $('#status').text("Checkmate! Tutorial completed successfully.");
            }
        }

        /* --- Game Status & UI Updates --- */
        function updateGameState() {
            updateStatusText();
            renderMoveHistory();
            if (mode !== 'tutorial') {
                startTimer();
            }
        }

        function updateStatusText() {
            let statusText = '';
            let moveColor = game.turn() === 'w' ? 'White' : 'Black';

            if (game.in_checkmate()) {
                statusText = 'Game over! ' + moveColor + ' is in checkmate.';
                stopTimer();
            } else if (game.in_draw()) {
                statusText = 'Game over! Stalemate / Draw.';
                stopTimer();
            } else {
                statusText = moveColor + ' to move.';
                if (game.in_check()) {
                    statusText += ' (' + moveColor + ' is in check)';
                }
            }
            $('#status').text(statusText);
        }

        function renderMoveHistory() {
            const history = game.history();
            if (history.length === 0) {
                $('#moveList').html('No moves yet.');
                return;
            }

            let historyHTML = '';
            for (let i = 0; i < history.length; i += 2) {
                const moveNumber = Math.floor(i / 2) + 1;
                const whiteMove = history[i];
                const blackMove = history[i + 1] ? history[i + 1] : '';
                historyHTML += `<div><strong>${moveNumber}.</strong> ${whiteMove} ${blackMove}</div>`;
            }

            const moveListDiv = $('#moveList');
            moveListDiv.html(historyHTML);
            moveListDiv.scrollTop(moveListDiv[0].scrollHeight);
        }

        /* --- Timer Functions --- */
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateTimerDisplay() {
            $('#whiteTimer').text('White: ' + formatTime(whiteTime));
            $('#blackTimer').text('Black: ' + formatTime(blackTime));

            if (game.turn() === 'w') {
                $('#whiteTimer').addClass('active');
                $('#blackTimer').removeClass('active');
            } else {
                $('#blackTimer').addClass('active');
                $('#whiteTimer').removeClass('active');
            }
        }

        function startTimer() {
            stopTimer();
            if (game.game_over()) return;

            updateTimerDisplay();

            timerInterval = setInterval(() => {
                if (game.turn() === 'w') {
                    whiteTime--;
                    if (whiteTime <= 0) {
                        whiteTime = 0;
                        stopTimer();
                        $('#status').text('Game Over! Black wins on time.');
                    }
                } else {
                    blackTime--;
                    if (blackTime <= 0) {
                        blackTime = 0;
                        stopTimer();
                        $('#status').text('Game Over! White wins on time.');
                    }
                }
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimers() {
            stopTimer();
            whiteTime = INITIAL_TIME_IN_SECONDS;
            blackTime = INITIAL_TIME_IN_SECONDS;
            updateTimerDisplay();
        }

        /* --- Game Mode Handlers --- */
        function startLocalGame() {
            mode = 'local';
            currentRoom = null;
            $('#tutorialCard').slideUp();
            game.reset();
            resetTimers();
            renderMoveHistory();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            $('#status').text('Local game started. White to move.');
            startTimer();
        }

        function createRoom() {
            mode = 'remote';
            $('#tutorialCard').slideUp();
            socket.emit('create_room');
        }

        function joinRoom() {
            const roomCode = $('#roomInput').val().trim();
            if (roomCode.length === 0) return alert('Please enter a room code.');
            mode = 'remote';
            $('#tutorialCard').slideUp();
            socket.emit('join_room', { room_code: roomCode });
        }

        /* --- Socket Event Handlers --- */
        socket.on('room_created', (data) => {
            currentRoom = data.room_code;
            playerColor = data.color;
            game.reset();
            resetTimers();
            renderMoveHistory();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                orientation: 'white',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            $('#status').text('Room created! Code: ' + currentRoom + '. Share this code with Player 2.');
        });

        socket.on('player_joined', (data) => {
            currentRoom = data.room_code;
            playerColor = data.color;
            game.reset();
            resetTimers();
            renderMoveHistory();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                orientation: 'black',
                pieceTheme: PIECE_THEME_URL,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            $('#status').text('Joined room ' + currentRoom + ' as Black.');
        });

        socket.on('game_start', (data) => {
            $('#status').text(data.message);
            startTimer();
        });

        socket.on('move_made', (data) => {
            game.move(data.move);
            board.position(game.fen());
            updateGameState();
        });

        socket.on('error_message', (data) => {
            alert(data.message);
        });

        // Initialize local board on load
        startLocalGame();
    </script>
</body>
</html>
